<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>kumo — choose your matcha tea</title>

  <!-- Google Fonts: Fraunces & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@200..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            kumo: {
              frame: '#889356',
              frameDark: '#67733c',
              cream: '#f4f3ec',
              card: '#f7f6f0',
              gold: '#e0c078'
            }
          },
          fontFamily: {
            serif: ['"Fraunces"', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #889356;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* 3D Continuous Orbit Conveyor Transitions */
    .orbit-card {
      transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s ease;
      will-change: transform, opacity;
    }

    /* Seamless Foreground Scene Crossfades */
    .fg-layer {
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: opacity;
    }

    /* Squircle Card 3D Depth & Lighting */
    .squircle-card {
      background-color: #f7f6f0;
      box-shadow: 0 16px 36px -6px rgba(0, 0, 0, 0.38), 0 0 0 1px rgba(255, 255, 255, 0.65) inset;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .squircle-card:hover {
      transform: scale(1.05);
      box-shadow: 0 20px 42px -4px rgba(0, 0, 0, 0.45), 0 0 0 1.5px rgba(255, 255, 255, 0.9) inset;
    }

    /* Minimalist Price Badge */
    .price-pill {
      box-shadow: 0 12px 28px -4px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s ease;
    }
    .price-pill:hover {
      transform: scale(1.08);
      box-shadow: 0 16px 34px -2px rgba(0, 0, 0, 0.55), 0 0 0 1.5px rgba(255, 255, 255, 1) inset;
    }
    .price-pill:active {
      transform: scale(0.95);
    }

    /* Headline Entrance */
    .headline-appear {
      animation: fadeInHeadline 1.0s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
    }
    @keyframes fadeInHeadline {
      0% {
        opacity: 0;
        transform: translateY(18px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Price Badge Pop-in */
    .price-appear {
      animation: popInPrice 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.9s both;
    }
    @keyframes popInPrice {
      0% {
        opacity: 0;
        transform: scale(0.4) translateY(20px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
  </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-2 sm:p-4 md:p-6 select-none bg-[#889356]">

  <!-- Outer Editorial Device Frame (Matches exact Dribbble presentation & matcha lp.mp4) -->
  <main class="w-full h-full max-w-[1240px] max-h-[860px] bg-[#889356] border-[8px] sm:border-[14px] md:border-[18px] border-[#67733c] rounded-[28px] sm:rounded-[38px] md:rounded-[46px] p-2 sm:p-4 shadow-2xl relative flex flex-col justify-between overflow-hidden">
    
    <!-- Inner Viewport Screen -->
    <div id="screen-viewport" class="w-full h-full rounded-[20px] sm:rounded-[28px] md:rounded-[34px] overflow-hidden relative shadow-inner bg-[#1e2716] flex flex-col justify-between">
      
      <!-- LAYER 1: BASE STUDIO WALL BACKDROP (z-0) -->
      <!-- Smooth dark olive studio lighting wall; ZERO cups exist here! -->
      <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
        <img src="assets/kumo/v2/bg_studio_wall.webp" alt="Studio Backdrop" class="absolute inset-0 w-full h-full object-cover object-center" />
      </div>

      <!-- LAYER 2: 3D ORBIT CAROUSEL (z-10) -->
      <!-- Positioned BEHIND the cup (z-20) and BEHIND the mountain dust (z-20) -->
      <!-- Cards slide behind the cup across the center, and vanish down into the matcha dust at the extremes! -->
      <div class="relative flex-grow flex flex-col items-center justify-center -mt-2 sm:-mt-6 z-10 pointer-events-none">
        
        <!-- Center Stage Visual Anchor Container -->
        <div class="w-full max-w-4xl relative h-64 sm:h-80 md:h-[400px] flex items-center justify-center">
          
          <div id="orbit-carousel" class="absolute inset-0 flex items-center justify-center pointer-events-auto">
            
            <!-- Card 0: Real 3D Strawberry -->
            <div id="orbit-item-0" onclick="selectFlavor(0)" class="orbit-card absolute cursor-pointer select-none flex flex-col items-center group">
              <div class="squircle-card w-20 h-20 sm:w-28 sm:h-28 md:w-32 md:h-32 rounded-[22px] sm:rounded-[30px] md:rounded-[34px] p-2.5 sm:p-3.5 flex items-center justify-center">
                <img src="assets/kumo/v2/fruit_strawberry.png" alt="Fresh 3D Strawberry" class="w-full h-full object-contain pointer-events-none drop-shadow-md" />
              </div>
            </div>

            <!-- Card 1: Real 3D Pure Tea Leaves -->
            <div id="orbit-item-1" onclick="selectFlavor(1)" class="orbit-card absolute cursor-pointer select-none flex flex-col items-center group">
              <div class="squircle-card w-20 h-20 sm:w-28 sm:h-28 md:w-32 md:h-32 rounded-[22px] sm:rounded-[30px] md:rounded-[34px] p-2.5 sm:p-3.5 flex items-center justify-center">
                <img src="assets/kumo/v2/fruit_leaf.png" alt="Glossy 3D Tea Leaves" class="w-full h-full object-contain pointer-events-none drop-shadow-md" />
              </div>
            </div>

            <!-- Card 2: Real 3D Wild Blueberry -->
            <div id="orbit-item-2" onclick="selectFlavor(2)" class="orbit-card absolute cursor-pointer select-none flex flex-col items-center group">
              <div class="squircle-card w-20 h-20 sm:w-28 sm:h-28 md:w-32 md:h-32 rounded-[22px] sm:rounded-[30px] md:rounded-[34px] p-2.5 sm:p-3.5 flex items-center justify-center">
                <img src="assets/kumo/v2/fruit_blueberry.png" alt="Plump 3D Blueberry" class="w-full h-full object-contain pointer-events-none drop-shadow-md" />
              </div>
            </div>

            <!-- Card 3: Real 3D Cranberries (Default Active) -->
            <div id="orbit-item-3" onclick="selectFlavor(3)" class="orbit-card absolute cursor-pointer select-none flex flex-col items-center group">
              <div class="squircle-card w-20 h-20 sm:w-28 sm:h-28 md:w-32 md:h-32 rounded-[22px] sm:rounded-[30px] md:rounded-[34px] p-2.5 sm:p-3.5 flex items-center justify-center">
                <img src="assets/kumo/v2/fruit_cranberry.png" alt="Red 3D Cranberries" class="w-full h-full object-contain pointer-events-none drop-shadow-md" />
              </div>
            </div>

            <!-- Card 4: Real 3D Ripe Raspberry -->
            <div id="orbit-item-4" onclick="selectFlavor(4)" class="orbit-card absolute cursor-pointer select-none flex flex-col items-center group">
              <div class="squircle-card w-20 h-20 sm:w-28 sm:h-28 md:w-32 md:h-32 rounded-[22px] sm:rounded-[30px] md:rounded-[34px] p-2.5 sm:p-3.5 flex items-center justify-center">
                <img src="assets/kumo/v2/fruit_raspberry.png" alt="Ripe 3D Raspberry" class="w-full h-full object-contain pointer-events-none drop-shadow-md" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- LAYER 3: FOREGROUND MASTER SCENE (z-20) -->
      <!-- Contains BOTH the single 3D matcha cup AND the matcha powder mountain! -->
      <!-- Sky above the mountain on the left & right is transparent; cards pass BEHIND the cup and BEHIND the mountain dust! -->
      <!-- Scales identically to the viewport with object-cover; strictly ONE cup exists! -->
      <div class="absolute inset-0 pointer-events-none z-20 overflow-hidden">
        <!-- Foreground 0: Strawberry -->
        <img id="fg-scene-0" src="assets/kumo/v2/fg_scene_strawberry.webp" alt="Strawberry Matcha Cup and Mountain" class="fg-layer absolute inset-0 w-full h-full object-cover object-center opacity-0" />
        
        <!-- Foreground 1: Pure Ceremonial Leaf -->
        <img id="fg-scene-1" src="assets/kumo/v2/fg_scene_leaf.webp" alt="Pure Leaf Matcha Cup and Mountain" class="fg-layer absolute inset-0 w-full h-full object-cover object-center opacity-0" />
        
        <!-- Foreground 2: Wild Blueberry -->
        <img id="fg-scene-2" src="assets/kumo/v2/fg_scene_blueberry.webp" alt="Blueberry Matcha Cup and Mountain" class="fg-layer absolute inset-0 w-full h-full object-cover object-center opacity-0" />
        
        <!-- Foreground 3: Cranberry (Default Active) -->
        <img id="fg-scene-3" src="assets/kumo/v2/fg_scene_cranberry.webp" alt="Cranberry Matcha Cup and Mountain" class="fg-layer absolute inset-0 w-full h-full object-cover object-center opacity-100" />
        
        <!-- Foreground 4: Ruby Raspberry -->
        <img id="fg-scene-4" src="assets/kumo/v2/fg_scene_raspberry.webp" alt="Raspberry Matcha Cup and Mountain" class="fg-layer absolute inset-0 w-full h-full object-cover object-center opacity-0" />
      </div>

      <!-- LAYER 4: ETCHED FLAVOUR TITLE OVER CUP (z-25) -->
      <div class="absolute inset-0 z-25 flex items-center justify-center pointer-events-none -mt-2 sm:-mt-6">
        <div class="w-full max-w-4xl relative h-64 sm:h-80 md:h-[400px] flex items-center justify-center">
          <div class="relative w-48 sm:w-64 md:w-80 h-full flex items-center justify-center">
            <div class="absolute top-[49%] inset-x-0 text-center pointer-events-none">
              <span id="cup-flavor-title" class="font-serif text-white/95 text-2xl sm:text-3xl md:text-4xl font-bold tracking-normal drop-shadow-[0_2px_8px_rgba(0,0,0,0.85)] transition-all duration-300">
                Crunberry
              </span>
            </div>
          </div>
        </div>
      </div>

      <!-- LAYER 5: FLOATING PRICE BADGE & HEADLINE (z-30) -->
      <div class="absolute inset-x-0 bottom-16 sm:bottom-20 z-30 flex flex-col items-center pointer-events-none px-4">
        
        <!-- Minimalist Price Badge resting at the mountain peak -->
        <div class="pointer-events-auto price-appear mb-3 sm:mb-4">
          <button onclick="openCheckoutModal()" class="price-pill bg-white text-neutral-900 w-12 sm:w-14 h-16 sm:h-18 py-2 px-1 rounded-xl sm:rounded-2xl flex flex-col items-center justify-between cursor-pointer border border-white/80" title="Add to Cart">
            <span id="flavor-price-tag" class="text-[11px] sm:text-xs font-bold tracking-tight text-neutral-800">19.33$</span>
            <span class="material-symbols-outlined text-[18px] sm:text-[20px] text-neutral-950 font-medium">shopping_cart</span>
          </button>
        </div>

        <!-- Headline "Chooise you matcha tea" -->
        <div class="text-center headline-appear">
          <h2 class="font-serif text-2xl sm:text-4xl md:text-5xl font-bold text-white tracking-tight drop-shadow-[0_4px_16px_rgba(0,0,0,0.85)]">
            Chooise you matcha tea
          </h2>
        </div>
      </div>

      <!-- LAYER 6: TOP FLOATING NAVIGATION BAR (z-40) -->
      <header class="relative z-40 pt-3 sm:pt-5 px-4 sm:px-8 flex items-center justify-between">
        <!-- Brand Logo -->
        <a href="#" class="font-serif text-2xl sm:text-3xl md:text-4xl font-bold tracking-tight text-white drop-shadow-[0_2px_8px_rgba(0,0,0,0.6)]">
          kumo
        </a>

        <!-- Floating Glassmorphic Pill -->
        <div class="flex items-center gap-2 sm:gap-3.5 px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl sm:rounded-2xl bg-black/60 backdrop-blur-md border border-white/10 shadow-lg text-white/90">
          <button class="p-1 hover:text-white transition cursor-pointer" title="Menu">
            <span class="material-symbols-outlined text-[17px] sm:text-[19px] block">grid_view</span>
          </button>
          <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="p-1 hover:text-white transition opacity-90 hover:opacity-100" title="Instagram">
            <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 fill-current" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
          </a>
          <a href="https://threads.net" target="_blank" rel="noopener noreferrer" class="p-1 hover:text-white transition opacity-90 hover:opacity-100" title="Threads">
            <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 fill-current" viewBox="0 0 24 24"><path d="M12.186 24h-.007c-3.581-.024-6.334-1.213-8.184-3.535C2.26 18.232 1.5 15.357 1.5 11.954c0-3.616.924-6.621 2.748-8.932C6.115.654 8.835 0 12.33 0c3.488 0 6.208.647 8.082 1.923 1.874 1.276 2.878 3.123 2.983 5.49.034.787-.52 1.449-1.296 1.449-.714 0-1.309-.553-1.345-1.267-.075-1.758-.809-3.08-2.182-3.927-1.373-.847-3.473-1.298-6.242-1.298-2.906 0-5.127.525-6.602 1.562-1.475 1.036-2.223 2.57-2.223 4.561 0 1.83.693 3.322 2.062 4.435 1.368 1.113 3.393 1.677 6.02 1.677h.459c2.316 0 4.197-.565 5.59-1.68 1.394-1.115 2.12-2.736 2.16-4.819.04-2.083-.628-3.753-1.986-4.964-1.358-1.211-3.284-1.849-5.726-1.897-2.317-.046-4.3.504-5.895 1.636-1.595 1.132-2.451 2.74-2.545 4.779-.094 2.04.607 3.666 2.085 4.832 1.478 1.166 3.493 1.764 5.99 1.777.787.004 1.423.642 1.42 1.429-.003.787-.643 1.422-1.43 1.418-3.048-.016-5.592-.767-7.561-2.233-1.969-1.465-2.92-3.645-2.827-6.48.093-2.834 1.258-5.068 3.463-6.64 2.204-1.571 5.01-2.348 8.341-2.308 3.197.039 5.823.868 7.807 2.464 1.984 1.596 3.011 3.901 3.052 6.853.041 2.952-.924 5.385-2.868 7.23-1.944 1.846-4.664 2.788-8.084 2.802h-.534c-2.41 0-4.364-.473-5.808-1.405-1.444-.933-2.222-2.28-2.312-4.004z"/></svg>
          </a>
          <a href="https://x.com" target="_blank" rel="noopener noreferrer" class="p-1 hover:text-white transition opacity-90 hover:opacity-100" title="X (Twitter)">
            <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          </a>
          <!-- Cart Button -->
          <button onclick="openCheckoutModal()" class="ml-1 sm:ml-2 px-2.5 sm:px-3 py-1 rounded-lg bg-black/70 hover:bg-black text-white flex items-center gap-1.5 transition cursor-pointer" title="Cart">
            <span class="material-symbols-outlined text-[15px] sm:text-[17px]">shopping_cart</span>
            <span id="nav-cart-qty" class="text-[11px] font-bold text-amber-300">1</span>
          </button>
        </div>

        <!-- Location Pin -->
        <button class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl sm:rounded-2xl bg-black/60 backdrop-blur-md border border-white/10 flex items-center justify-center text-white hover:bg-black/80 transition cursor-pointer shadow-lg" title="Find Store">
          <span class="material-symbols-outlined text-[18px] sm:text-[20px]">location_on</span>
        </button>
      </header>

      <!-- LAYER 7: BOTTOM CONTROLS & AUTO-TOUR (z-40) -->
      <footer class="relative z-40 pb-3 sm:pb-4 px-4 sm:px-8">
        <div class="flex items-center justify-between gap-3 sm:gap-6 max-w-2xl mx-auto">
          
          <!-- Play / Pause Auto-Tour Toggle (Matches || button in matcha lp.mp4) -->
          <button id="play-pause-btn" onclick="toggleAutoPlay()" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-white/20 hover:bg-white/35 backdrop-blur-md flex items-center justify-center text-white transition cursor-pointer active:scale-90 shadow-md" title="Play/Pause Rotation Tour">
            <span id="play-pause-icon" class="material-symbols-outlined text-[18px]">play_arrow</span>
          </button>

          <!-- Smooth Indicator Dots & Scrubber Track -->
          <div class="flex-grow flex items-center gap-3 bg-black/45 backdrop-blur-md px-4 py-2 rounded-full border border-white/10 shadow-lg">
            
            <!-- Rotate Left Arrow Button -->
            <button onclick="prevFlavor()" class="p-0.5 hover:text-amber-300 text-white/80 transition cursor-pointer active:scale-90" title="Previous Flavour">
              <span class="material-symbols-outlined text-[18px] block">arrow_back</span>
            </button>

            <!-- 5 Interactive Flavour Dots -->
            <div class="flex items-center gap-2 sm:gap-3 mx-auto">
              <button onclick="selectFlavor(0)" id="dot-0" class="w-2.5 h-2.5 rounded-full transition-all duration-300 bg-white/40 hover:bg-white cursor-pointer" title="Strawberry"></button>
              <button onclick="selectFlavor(1)" id="dot-1" class="w-2.5 h-2.5 rounded-full transition-all duration-300 bg-white/40 hover:bg-white cursor-pointer" title="Pure Ceremonial Leaf"></button>
              <button onclick="selectFlavor(2)" id="dot-2" class="w-2.5 h-2.5 rounded-full transition-all duration-300 bg-white/40 hover:bg-white cursor-pointer" title="Wild Blueberry"></button>
              <button onclick="selectFlavor(3)" id="dot-3" class="w-3.5 h-3.5 rounded-full transition-all duration-300 bg-amber-300 shadow scale-110 cursor-pointer" title="Cranberry"></button>
              <button onclick="selectFlavor(4)" id="dot-4" class="w-2.5 h-2.5 rounded-full transition-all duration-300 bg-white/40 hover:bg-white cursor-pointer" title="Ruby Raspberry"></button>
            </div>

            <!-- Rotate Right Arrow Button -->
            <button onclick="nextFlavor()" class="p-0.5 hover:text-amber-300 text-white/80 transition cursor-pointer active:scale-90" title="Next Flavour">
              <span class="material-symbols-outlined text-[18px] block">arrow_forward</span>
            </button>
          </div>

          <!-- Quick Flavour Re-center Button -->
          <button onclick="selectFlavor(3)" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-white/20 hover:bg-white/35 backdrop-blur-md flex items-center justify-center text-white transition cursor-pointer active:scale-90 shadow-md text-xs font-bold" title="Reset to Cranberry">
            <span class="material-symbols-outlined text-[16px]">restart_alt</span>
          </button>
        </div>
      </footer>

    </div>
  </main>

  <!-- INSTANT ORDER MODAL -->
  <div id="checkout-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md transition-opacity duration-300 opacity-0 pointer-events-none">
    <div class="bg-gradient-to-b from-[#222d1b] to-[#141b10] border border-white/20 rounded-3xl p-6 sm:p-8 max-w-sm w-full text-white shadow-2xl relative text-center transform scale-95 transition-transform duration-300" id="checkout-modal-card">
      
      <!-- Close button -->
      <button onclick="closeCheckoutModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition cursor-pointer">
        <span class="material-symbols-outlined text-sm">close</span>
      </button>

      <!-- Active Fruit Thumbnail -->
      <div class="w-24 h-24 mx-auto rounded-3xl bg-[#f7f6f0] p-3 flex items-center justify-center mb-3 shadow-lg border border-white/30 overflow-hidden">
        <img id="modal-fruit-img" src="assets/kumo/v2/fruit_cranberry.png" alt="Selected Fruit" class="w-full h-full object-contain filter drop-shadow" />
      </div>

      <span class="text-xs uppercase tracking-widest text-amber-300 font-bold">Kumo Fresh Brew</span>
      <h3 class="font-serif text-2xl font-bold mt-1 text-white" id="modal-flavor-name">Cranberry Iced Matcha</h3>
      <p class="text-xs text-white/70 mt-1" id="modal-flavor-desc">Authentic single-origin ceremonial Uji matcha swirled with fresh tart cranberries.</p>

      <div class="bg-white/5 border border-white/10 rounded-2xl p-4 my-5 flex items-center justify-between">
        <div class="text-left">
          <span class="text-[11px] text-white/60 block">Price</span>
          <span class="text-xl font-bold font-serif text-white" id="modal-price-display">$19.33</span>
        </div>
        <div class="text-right">
          <span class="text-[11px] text-emerald-400 block font-semibold">Freshly Made</span>
          <span class="text-[11px] text-white/60">Glass Straw Included</span>
        </div>
      </div>

      <button onclick="confirmPurchase()" class="w-full bg-amber-300 hover:bg-amber-400 text-black font-bold py-3.5 rounded-xl uppercase tracking-wider text-xs transition cursor-pointer shadow-lg flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-base">shopping_bag</span>
        <span>Confirm Order &amp; Pay</span>
      </button>
      <p class="text-[10px] text-white/40 mt-3">Ready for pickup or local delivery in 15 mins</p>
    </div>
  </div>

  <!-- JAVASCRIPT: CONTINUOUS CONVEYOR SLIDE BEHIND CUP & MATCHA DUST -->
  <script>
    const flavors = [
      {
        id: 'strawberry',
        cupTitle: 'Strawberry',
        fullName: 'Strawberry Swirl Matcha',
        fruitImg: 'assets/kumo/v2/fruit_strawberry.png',
        desc: 'Sweet ripe strawberries layered into velvety oat milk and freshly whisked ceremonial Uji matcha.',
        price: '18.50$'
      },
      {
        id: 'leaf',
        cupTitle: 'Pure Leaf',
        fullName: '100% Ceremonial Uji Matcha',
        fruitImg: 'assets/kumo/v2/fruit_leaf.png',
        desc: 'Pure, shade-grown ceremonial green tea leaves from Kyoto with stone-ground creamy oat milk.',
        price: '16.00$'
      },
      {
        id: 'blueberry',
        cupTitle: 'Blueberry',
        fullName: 'Wild Blueberry Matcha',
        fruitImg: 'assets/kumo/v2/fruit_blueberry.png',
        desc: 'Wild mountain blueberries bursting with natural antioxidants and smooth layered matcha.',
        price: '19.00$'
      },
      {
        id: 'cranberry',
        cupTitle: 'Crunberry',
        fullName: 'Cranberry Iced Matcha',
        fruitImg: 'assets/kumo/v2/fruit_cranberry.png',
        desc: 'Lush tart ruby cranberries swirled into sweet cream and vivid green ceremonial matcha.',
        price: '19.33$'
      },
      {
        id: 'raspberry',
        cupTitle: 'Raspberry',
        fullName: 'Ripe Raspberry Matcha',
        fruitImg: 'assets/kumo/v2/fruit_raspberry.png',
        desc: 'Tangy fresh raspberries crushed over iced milk and rich stone-ground green tea.',
        price: '18.75$'
      }
    ];

    let activeIndex = 3; // Cranberry default active
    let autoPlayInterval = null;
    let isAutoPlaying = false;
    let hasEntered = false;

    // 5 Orbit Positions along the continuous 3D arc:
    // Slot 0 (center): Behind the cup (z-10, cup is at z-20 so card passes BEHIND the cup)
    // Slot -1 / +1: High in the open sky
    // Slot -2 / +2: Extreme ends sinking DOWN into the matcha dust (behind the mountain slopes at z-20)
    const orbitSlots = [
      { x: -410, y: 130, scale: 0.74, rotate: -26, opacity: 0.70 }, // Slot -2 (Sinking into left matcha dust)
      { x: -215, y: -38, scale: 0.95, rotate: -12, opacity: 1.00 }, // Slot -1 (Left Open Sky)
      { x: 0,    y: -75, scale: 1.05, rotate: 0,   opacity: 1.00 }, // Slot  0 (Passing BEHIND the center cup!)
      { x: 215,  y: -38, scale: 0.95, rotate: 12,  opacity: 1.00 }, // Slot +1 (Right Open Sky)
      { x: 410,  y: 130, scale: 0.74, rotate: 26,  opacity: 0.70 }  // Slot +2 (Sinking into right matcha dust)
    ];

    function updateOrbit(animate = true) {
      const isMobile = window.innerWidth < 640;
      const isTablet = window.innerWidth >= 640 && window.innerWidth < 1024;
      const spreadFactor = isMobile ? 0.44 : (isTablet ? 0.72 : 1.0);
      const yFactor = isMobile ? 0.65 : 1.0;

      for (let i = 0; i < 5; i++) {
        const cardEl = document.getElementById('orbit-item-' + i);
        const dotEl = document.getElementById('dot-' + i);
        const fgEl = document.getElementById('fg-scene-' + i);
        if (!cardEl) continue;

        // Circular slot offset relative to activeIndex
        let offset = (i - activeIndex) % 5;
        if (offset < -2) offset += 5;
        if (offset > 2) offset -= 5;

        const slot = orbitSlots[offset + 2];
        const posX = slot.x * spreadFactor;
        const posY = slot.y * yFactor;

        if (hasEntered) {
          cardEl.style.transition = animate ? 'transform 0.85s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s ease' : 'none';
          cardEl.style.transform = `translate(${posX}px, ${posY}px) rotate(${slot.rotate}deg) scale(${slot.scale})`;
          cardEl.style.opacity = slot.opacity;
        }

        // Indicator dot styling
        if (dotEl) {
          if (i === activeIndex) {
            dotEl.className = 'w-3.5 h-3.5 rounded-full transition-all duration-300 bg-amber-300 shadow scale-110 cursor-pointer';
          } else {
            dotEl.className = 'w-2.5 h-2.5 rounded-full transition-all duration-300 bg-white/40 hover:bg-white cursor-pointer';
          }
        }

        // Smooth foreground scene crossfade (Cup + Mountain change flavor seamlessly)
        if (fgEl) {
          fgEl.style.opacity = (i === activeIndex) ? '1' : '0';
        }
      }

      // Update Flavour Title & Price Tag
      const current = flavors[activeIndex];
      const titleEl = document.getElementById('cup-flavor-title');
      const priceEl = document.getElementById('flavor-price-tag');

      if (titleEl) titleEl.innerText = current.cupTitle;
      if (priceEl) priceEl.innerText = current.price;
    }

    // Opening Entrance Animation (Cards rise up from behind the matcha mountain dust)
    function playEntranceAnimation() {
      // Step 1: Start cards deep down behind the mountain dust (z-10 behind foreground at z-20)
      for (let i = 0; i < 5; i++) {
        const cardEl = document.getElementById('orbit-item-' + i);
        if (!cardEl) continue;
        cardEl.style.transition = 'none';
        cardEl.style.transform = 'translate(0px, 240px) scale(0.4)';
        cardEl.style.opacity = '0';
      }

      // Step 2: Smoothly rise and fan out into the uninterrupted arc
      setTimeout(() => {
        hasEntered = true;
        for (let i = 0; i < 5; i++) {
          const cardEl = document.getElementById('orbit-item-' + i);
          if (!cardEl) continue;
          cardEl.style.transition = 'transform 1.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease';
        }
        updateOrbit(true);
      }, 400);
    }

    function selectFlavor(index) {
      activeIndex = (index + 5) % 5;
      updateOrbit(true);
    }

    function prevFlavor() {
      selectFlavor(activeIndex - 1);
    }

    function nextFlavor() {
      selectFlavor(activeIndex + 1);
    }

    // Auto-Tour Playback Toggle (Matches automatic rotation in matcha lp.mp4)
    function toggleAutoPlay() {
      const icon = document.getElementById('play-pause-icon');
      if (isAutoPlaying) {
        clearInterval(autoPlayInterval);
        isAutoPlaying = false;
        if (icon) icon.innerText = 'play_arrow';
      } else {
        isAutoPlaying = true;
        if (icon) icon.innerText = 'pause';
        autoPlayInterval = setInterval(() => {
          nextFlavor();
        }, 2200);
      }
    }

    // Keyboard Arrow navigation (← / →)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') { prevFlavor(); if (isAutoPlaying) toggleAutoPlay(); }
      if (e.key === 'ArrowRight') { nextFlavor(); if (isAutoPlaying) toggleAutoPlay(); }
      if (e.key === ' ' || e.key === 'k') { e.preventDefault(); toggleAutoPlay(); }
      if (e.key === 'Escape') closeCheckoutModal();
    });

    // Touch swipe gesture support
    let touchStartX = 0;
    const viewport = document.getElementById('screen-viewport');
    if (viewport) {
      viewport.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });
      viewport.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].screenX;
        if (touchStartX - touchEndX > 45) { nextFlavor(); if (isAutoPlaying) toggleAutoPlay(); }
        if (touchEndX - touchStartX > 45) { prevFlavor(); if (isAutoPlaying) toggleAutoPlay(); }
      }, { passive: true });
    }

    window.addEventListener('resize', () => updateOrbit(false));

    // Instant Checkout Modal Handlers
    function openCheckoutModal() {
      if (isAutoPlaying) toggleAutoPlay();
      const current = flavors[activeIndex];
      const modal = document.getElementById('checkout-modal');
      const modalName = document.getElementById('modal-flavor-name');
      const modalDesc = document.getElementById('modal-flavor-desc');
      const modalPrice = document.getElementById('modal-price-display');
      const modalImg = document.getElementById('modal-fruit-img');

      if (modalName) modalName.innerText = current.fullName;
      if (modalDesc) modalDesc.innerText = current.desc;
      if (modalPrice) modalPrice.innerText = '$' + current.price.replace('$', '');
      if (modalImg) modalImg.src = current.fruitImg;

      if (modal) {
        modal.classList.remove('opacity-0', 'pointer-events-none');
        modal.classList.add('opacity-100', 'pointer-events-auto');
        const card = document.getElementById('checkout-modal-card');
        if (card) card.classList.remove('scale-95');
      }
    }

    function closeCheckoutModal() {
      const modal = document.getElementById('checkout-modal');
      if (modal) {
        modal.classList.add('opacity-0', 'pointer-events-none');
        modal.classList.remove('opacity-100', 'pointer-events-auto');
        const card = document.getElementById('checkout-modal-card');
        if (card) card.classList.add('scale-95');
      }
    }

    function confirmPurchase() {
      const current = flavors[activeIndex];
      alert(`Order confirmed for 1x ${current.fullName} (${current.price})! Thank you for choosing Kumo.`);
      closeCheckoutModal();
    }

    // Trigger opening entrance animation on page load
    window.addEventListener('DOMContentLoaded', playEntranceAnimation);
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      playEntranceAnimation();
    }
  </script>
</body>
</html>
